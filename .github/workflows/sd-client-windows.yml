name: SD-Client Windows x64

# Builds SD-Client for Windows x64 on a GitHub-hosted runner and publishes
# SD-Client-Complete.zip as a workflow artifact (Actions -> run -> Artifacts).
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The ddnet-libs submodule (prebuilt SDL2, FreeType, curl, ... for Windows) is empty in a plain
      # source upload, so it is always fetched explicitly here.
      - name: Fetch ddnet-libs
        shell: bash
        run: |
          rm -rf ddnet-libs
          git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs
          ls ddnet-libs

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Configure (Release, x64)
        shell: bash
        run: |
          mkdir release
          cd release
          cmake -A x64 -DCMAKE_BUILD_TYPE=Release \
            -DCLIENT=ON -DSERVER=OFF -DTOOLS=OFF -DVIDEORECORDER=OFF -DDOWNLOAD_GTEST=OFF \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..

      - name: Build client
        shell: bash
        run: |
          cd release
          cmake --build . --config Release --target DDNet -- -m 2>&1 | tee build.log

      - name: Package SD-Client-Complete.zip
        shell: bash
        run: |
          set -e
          OUT=SD-Client-Release
          rm -rf "$OUT"
          mkdir -p "$OUT/config"
          test -f release/DDNet.exe
          cp release/DDNet.exe "$OUT/SD-Client.exe"
          cp release/*.dll "$OUT/" 2>/dev/null || true
          cp -r data "$OUT/data"
          cp sd-client/README.txt "$OUT/README.txt"
          cp sd-client/config/* "$OUT/config/"
          ls -la "$OUT"
          # Make sure the data directory and DLLs are really there
          test -d "$OUT/data/fonts"
          test -f "$OUT/SD-Client.exe"
          ls "$OUT"/*.dll
          powershell -NoProfile -Command "Compress-Archive -Path '$OUT' -DestinationPath SD-Client-Complete.zip -Force"
          ls -la SD-Client-Complete.zip

      - name: Check DLL dependencies
        shell: bash
        run: |
          # lists the imported DLLs; every non-system DLL must be inside the package
          "$(vswhere -latest -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | head -n 1)" //dependents SD-Client-Release/SD-Client.exe || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: release/build.log
          if-no-files-found: ignore

      - name: Upload SD-Client-Complete.zip
        uses: actions/upload-artifact@v4
        with:
          name: SD-Client-Complete
          path: SD-Client-Complete.zip
